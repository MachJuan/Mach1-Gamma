<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mach1 Gamma — MES</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #0b0f14;
            color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #topbar {
            min-height: 72px;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 0 20px;
            box-sizing: border-box;
            background: #111820;
            border-bottom: 1px solid #26313d;
            flex-wrap: wrap;
        }

        .title {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .level {
            font-size: 14px;
            white-space: nowrap;
        }

        .call {
            color: #ff5252;
        }

        .flip {
            color: #ffd740;
        }

        .put {
            color: #69f0ae;
        }

        .regime {
            margin-left: auto;
            font-weight: bold;
            white-space: nowrap;
        }

        #updated {
            font-size: 11px;
            color: #8b98a5;
            white-space: nowrap;
        }

        #chart {
            width: 100%;
            height: calc(100% - 72px);
        }

        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }

        .tradingview-widget-container__widget {
            width: 100%;
            height: calc(100% - 32px);
        }

        .tradingview-widget-copyright {
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #8b98a5;
        }

        .tradingview-widget-copyright a {
            color: #8b98a5;
            text-decoration: none;
        }

        @media (max-width: 900px) {
            #topbar {
                min-height: 105px;
                gap: 10px 18px;
                padding: 10px 15px;
            }

            .title {
                width: 100%;
            }

            .regime {
                margin-left: 0;
            }

            #chart {
                height: calc(100% - 105px);
            }
        }
    </style>
</head>

<body>

<div id="topbar">

    <div class="title">
        MACH1 GAMMA — MES
    </div>

    <div class="level call">
        CALL WALL:
        <span id="callWall">---</span>
    </div>

    <div class="level flip">
        GAMMA FLIP:
        <span id="gammaFlip">---</span>
    </div>

    <div class="level put">
        PUT WALL:
        <span id="putWall">---</span>
    </div>

    <div class="regime" id="regime">
        ---
    </div>

    <div id="updated">
        Gamma: ---
    </div>

</div>

<div id="chart">

    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
        <div class="tradingview-widget-container__widget"></div>

        <div class="tradingview-widget-copyright">
            <a
                href="https://www.tradingview.com/"
                target="_blank"
                rel="noopener nofollow"
            >
                Charts by TradingView
            </a>
        </div>

        <script
            type="text/javascript"
            src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
            async
        >
        {
            "autosize": true,
            "symbol": "CME_MINI:MES1!",
            "interval": "5",
            "timezone": "Asia/Manila",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "backgroundColor": "rgba(11,15,20,1)",
            "gridColor": "rgba(38,49,61,0.35)",
            "hide_top_toolbar": false,
            "hide_legend": false,
            "allow_symbol_change": false,
            "save_image": false,
            "calendar": false,
            "withdateranges": true,
            "hide_side_toolbar": false,
            "details": false,
            "hotlist": false,
            "studies": [],
            "support_host": "https://www.tradingview.com"
        }
        </script>
    </div>
    <!-- TradingView Widget END -->

</div>


<script>

const DATA_URL =
    "https://machjuan.github.io/Mach1-Gamma/data/gex_es.json";


function updateGamma(data) {

    if (!data) {
        return;
    }


    // --------------------------------------------------------
    // GAMMA LEVELS
    // --------------------------------------------------------

    if (data.call_wall !== undefined) {

        document.getElementById("callWall")
            .textContent =
            Number(data.call_wall).toFixed(2);

    }


    if (data.gamma_flip !== undefined) {

        document.getElementById("gammaFlip")
            .textContent =
            Number(data.gamma_flip).toFixed(2);

    }


    if (data.put_wall !== undefined) {

        document.getElementById("putWall")
            .textContent =
            Number(data.put_wall).toFixed(2);

    }


    // --------------------------------------------------------
    // GAMMA REGIME
    // --------------------------------------------------------

    const regime =
        document.getElementById("regime");

    regime.textContent =
        data.regime || "---";


    if (data.regime === "NEGATIVE_GAMMA") {

        regime.style.color = "#ff5252";

    }

    else if (data.regime === "POSITIVE_GAMMA") {

        regime.style.color = "#69f0ae";

    }

    else {

        regime.style.color = "#ffffff";

    }


    // --------------------------------------------------------
    // UPDATE TIME
    // --------------------------------------------------------

    if (data.updated_utc) {

        const date =
            new Date(data.updated_utc);

        document.getElementById("updated")
            .textContent =
            "Gamma: " +
            date.toLocaleString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit",
                    timeZone: "Asia/Manila"
                }
            );

    }

}


// ------------------------------------------------------------
// LOAD GAMMA DATA
// ------------------------------------------------------------

async function loadGamma() {

    try {

        const response =
            await fetch(
                DATA_URL + "?t=" + Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "Mach1 Gamma:",
            data
        );


        updateGamma(data);

    }

    catch (error) {

        console.error(
            "Mach1 Gamma error:",
            error
        );

        document.getElementById("updated")
            .textContent =
            "Gamma: data unavailable";

    }

}


// ------------------------------------------------------------
// INITIAL LOAD
// ------------------------------------------------------------

loadGamma();


// ------------------------------------------------------------
// REFRESH GAMMA EVERY MINUTE
// ------------------------------------------------------------

setInterval(
    loadGamma,
    60 * 1000
);

</script>

</body>
</html>
