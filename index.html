<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mach1 Gamma — MES</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0b0f14;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

#header {
    height: 70px;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 20px;
    background: #111820;
    border-bottom: 1px solid #26313d;
}

.brand {
    font-size: 20px;
    font-weight: bold;
}

.level {
    font-size: 13px;
}

.value {
    font-size: 17px;
    font-weight: bold;
}

.call { color: #ff5252; }
.flip { color: #ffd740; }
.put { color: #69f0ae; }

#regime {
    margin-left: auto;
    padding: 7px 12px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
}

#updated {
    color: #8b98a5;
    font-size: 11px;
}

#main {
    height: calc(100% - 70px);
    display: flex;
}

#chart {
    flex: 1;
    min-width: 0;
}

.tradingview-widget-container {
    width: 100%;
    height: 100%;
}

.tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

#panel {
    width: 245px;
    background: #111820;
    border-left: 1px solid #26313d;
    padding: 18px;
}

.title {
    color: #8b98a5;
    font-size: 12px;
    letter-spacing: 1px;
    margin-bottom: 15px;
}

.card {
    background: #0d131a;
    border: 1px solid #26313d;
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 12px;
}

.label {
    color: #8b98a5;
    font-size: 10px;
    margin-bottom: 6px;
}

.number {
    font-size: 22px;
    font-weight: bold;
}

.call-number { color: #ff5252; }
.flip-number { color: #ffd740; }
.put-number { color: #69f0ae; }

#price {
    color: white;
}

#bias {
    font-size: 18px;
    font-weight: bold;
}

#status {
    font-size: 13px;
    line-height: 1.5;
    color: #8b98a5;
}

@media (max-width: 900px) {

    html, body {
        overflow: auto;
    }

    #header {
        height: auto;
        min-height: 110px;
        flex-wrap: wrap;
        padding: 12px;
        gap: 10px 15px;
    }

    .brand {
        width: 100%;
    }

    #regime {
        margin-left: 0;
    }

    #main {
        height: auto;
        flex-direction: column;
    }

    #chart {
        height: 65vh;
        min-height: 450px;
    }

    #panel {
        width: 100%;
        border-left: none;
        border-top: 1px solid #26313d;
    }
}
</style>
</head>

<body>

<div id="header">

    <div class="brand">
        MACH1 GAMMA — MES
    </div>

    <div class="level call">
        CALL WALL:
        <span class="value" id="callWall">---</span>
    </div>

    <div class="level flip">
        GAMMA FLIP:
        <span class="value" id="gammaFlip">---</span>
    </div>

    <div class="level put">
        PUT WALL:
        <span class="value" id="putWall">---</span>
    </div>

    <div id="regime">---</div>

    <div id="updated">
        Updating...
    </div>

</div>


<div id="main">

    <div id="chart">

        <div class="tradingview-widget-container">

            <div class="tradingview-widget-container__widget"></div>

            <script
                type="text/javascript"
                src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                async>
            {
                "autosize": true,
                "symbol": "CME_MINI:MES1!",
                "interval": "5",
                "timezone": "Asia/Manila",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "backgroundColor": "rgba(11,15,20,1)",
                "gridColor": "rgba(38,49,61,0.35)",
                "hide_top_toolbar": true,
                "hide_legend": false,
                "allow_symbol_change": false,
                "save_image": false,
                "calendar": false,
                "withdateranges": true,
                "hide_side_toolbar": true,
                "details": false,
                "hotlist": false,
                "studies": [],
                "support_host": "https://www.tradingview.com"
            }
            </script>

        </div>

    </div>


    <div id="panel">

        <div class="title">
            MACH1 TRADING LEVELS
        </div>


        <div class="card">

            <div class="label">
                MES PRICE
            </div>

            <div class="number" id="price">
                ---
            </div>

        </div>


        <div class="card">

            <div class="label">
                CALL WALL
            </div>

            <div class="number call-number" id="panelCallWall">
                ---
            </div>

        </div>


        <div class="card">

            <div class="label">
                GAMMA FLIP
            </div>

            <div class="number flip-number" id="panelGammaFlip">
                ---
            </div>

        </div>


        <div class="card">

            <div class="label">
                PUT WALL
            </div>

            <div class="number put-number" id="panelPutWall">
                ---
            </div>

        </div>


        <div class="card">

            <div class="label">
                MARKET BIAS
            </div>

            <div id="bias">
                ---
            </div>

        </div>


        <div class="card">

            <div class="label">
                STATUS
            </div>

            <div id="status">
                Waiting for data...
            </div>

        </div>

    </div>

</div>


<script>

const DATA_URL =
"https://machjuan.github.io/Mach1-Gamma/data/gex_es.json";


function setText(id, value) {

    const element =
        document.getElementById(id);

    if (element) {
        element.textContent = value;
    }
}


function updateGamma(data) {

    if (!data) return;


    const price =
        Number(data.es_spot);

    const callWall =
        Number(data.call_wall);

    const gammaFlip =
        Number(data.gamma_flip);

    const putWall =
        Number(data.put_wall);


    if (Number.isFinite(price)) {

        setText(
            "price",
            price.toFixed(2)
        );

    }


    if (Number.isFinite(callWall)) {

        const value =
            callWall.toFixed(2);

        setText("callWall", value);
        setText("panelCallWall", value);

    }


    if (Number.isFinite(gammaFlip)) {

        const value =
            gammaFlip.toFixed(2);

        setText("gammaFlip", value);
        setText("panelGammaFlip", value);

    }


    if (Number.isFinite(putWall)) {

        const value =
            putWall.toFixed(2);

        setText("putWall", value);
        setText("panelPutWall", value);

    }


    const regime =
        document.getElementById("regime");


    const bias =
        document.getElementById("bias");


    const status =
        document.getElementById("status");


    if (data.regime === "POSITIVE_GAMMA") {

        regime.textContent =
            "POSITIVE GAMMA";

        regime.style.color =
            "#69f0ae";

        regime.style.background =
            "rgba(105,240,174,0.12)";

    }

    else if (
        data.regime === "NEGATIVE_GAMMA"
    ) {

        regime.textContent =
            "NEGATIVE GAMMA";

        regime.style.color =
            "#ff5252";

        regime.style.background =
            "rgba(255,82,82,0.12)";

    }

    else {

        regime.textContent =
            data.regime || "UNKNOWN";

        regime.style.color =
            "#ffd740";

        regime.style.background =
            "rgba(255,215,64,0.12)";

    }


    if (
        Number.isFinite(price) &&
        Number.isFinite(gammaFlip)
    ) {

        if (price > gammaFlip) {

            bias.textContent =
                "LONG BIAS";

            bias.style.color =
                "#69f0ae";

            status.textContent =
                "Price above Gamma Flip. Favor confirmed upside setups.";

        }

        else if (price < gammaFlip) {

            bias.textContent =
                "SHORT BIAS";

            bias.style.color =
                "#ff5252";

            status.textContent =
                "Price below Gamma Flip. Favor confirmed downside setups.";

        }

        else {

            bias.textContent =
                "AT FLIP";

            bias.style.color =
                "#ffd740";

            status.textContent =
                "Price is at the Gamma Flip. Wait for direction.";

        }

    }


    if (data.updated_utc) {

        const date =
            new Date(data.updated_utc);

        const formatted =
            date.toLocaleString(
                "en-US",
                {
                    month: "short",
                    day: "numeric",
                    hour: "numeric",
                    minute: "2-digit",
                    timeZone: "Asia/Manila"
                }
            );

        setText(
            "updated",
            "Updated " + formatted
        );

    }

}


async function loadGamma() {

    try {

        const response =
            await fetch(
                DATA_URL +
                "?t=" +
                Date.now()
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        updateGamma(data);


    }

    catch (error) {

        console.error(
            "Mach1 Gamma:",
            error
        );

        setText(
            "updated",
            "Data unavailable"
        );

    }

}


loadGamma();

setInterval(
    loadGamma,
    60 * 1000
);

</script>

</body>
</html>
