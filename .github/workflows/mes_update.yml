name: Mach1 MES Price Update

on:
  schedule:
    # Every 5 minutes, Monday-Friday
    - cron: "*/5 * * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch delayed MES data
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = (
              "https://query1.finance.yahoo.com/v8/finance/chart/"
              "MES=F?range=1d&interval=5m&includePrePost=true"
          )

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0"
              }
          )

          print("Requesting MES data...")

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read().decode("utf-8")

              data = json.loads(raw)

          except Exception as e:
              print(f"Could not retrieve Yahoo data: {e}")
              raise SystemExit(0)

          chart = data.get("chart", {})
          result_list = chart.get("result")

          if not result_list:
              print("MES data unavailable.")
              print("This normally means the market is closed.")
              raise SystemExit(0)

          result = result_list[0]

          timestamps = result.get("timestamp")

          indicators = result.get("indicators", {})
          quote_list = indicators.get("quote", [])

          if not timestamps or not quote_list:
              print("MES market currently has no candle data.")
              print("Workflow will exit normally.")
              raise SystemExit(0)

          quotes = quote_list[0]

          opens = quotes.get("open", [])
          highs = quotes.get("high", [])
          lows = quotes.get("low", [])
          closes = quotes.get("close", [])
          volumes = quotes.get("volume", [])

          candles = []

          for i, timestamp in enumerate(timestamps):

              if i >= len(opens):
                  continue

              o = opens[i]
              h = highs[i]
              l = lows[i]
              c = closes[i]

              if None in (o, h, l, c):
                  continue

              v = 0

              if i < len(volumes) and volumes[i] is not None:
                  v = volumes[i]

              candles.append({
                  "time": timestamp,
                  "open": o,
                  "high": h,
                  "low": l,
                  "close": c,
                  "volume": v
              })

          if not candles:
              print("No valid MES candles available.")
              print("Market may be closed.")
              raise SystemExit(0)

          output = {
              "symbol": "MES",
              "source": "Yahoo Finance / CME delayed data",
              "delay_minutes": 10,
              "interval": "5m",
              "updated_utc": datetime.now(
                  timezone.utc
              ).isoformat(),
              "candles": candles
          }

          with open("data/mes.json", "w") as f:
              json.dump(output, f, indent=2)

          print(
              f"SUCCESS: Saved {len(candles)} MES candles."
          )

          print(
              f"Latest MES price: {candles[-1]['close']}"
          )
          PY

      - name: Commit MES data
        run: |
          git config user.name "Mach1 MES Bot"
          git config user.email "actions@github.com"

          git add data/mes.json

          if git diff --cached --quiet; then
            echo "No MES data changes."
          else
            git commit -m "Auto-update MES price data"

            git pull --rebase origin main
            git push origin main
          fi
