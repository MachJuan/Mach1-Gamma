name: Mach1 Gamma Auto Update

on:
  schedule:
    # Philippines Time (PHT / UTC+8)
    #
    # 1:00 PM PHT  = 05:00 UTC
    # 3:00 PM PHT  = 07:00 UTC
    # 5:00 PM PHT  = 09:00 UTC
    # 7:00 PM PHT  = 11:00 UTC
    # 9:00 PM PHT  = 13:00 UTC
    # 11:00 PM PHT = 15:00 UTC
    # 1:00 AM PHT  = 17:00 UTC
    # 3:00 AM PHT  = 19:00 UTC
    #
    # Monday-Friday UTC schedule
    - cron: "0 5,7,9,11,13,15,17,19 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gamma:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mach1 Gamma engine
        run: |
          python generate_gex.py

      - name: Commit updated gamma data
        run: |
          git config user.name "Mach1 Gamma Bot"
          git config user.email "actions@github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No gamma data changes."
          else
            git commit -m "Auto-update Mach1 Gamma levels"

            git pull --rebase origin main
            git push origin main
          fi
